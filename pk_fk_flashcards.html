<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Primary Keys vs. Foreign Keys — Flashcards</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0f13;
    --surface: #16181f;
    --card-front: #1c1f2b;
    --card-back: #111827;
    --accent: #5bf5a0;
    --accent2: #f5a05b;
    --accent3: #5b9ef5;
    --text: #e8eaf0;
    --text-muted: #8890a8;
    --border: #2a2d3a;
    --shadow: 0 8px 40px rgba(0,0,0,0.5);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "DM Mono", monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 48px;
    background-image: radial-gradient(ellipse at 20% 10%, rgba(91,245,160,0.07) 0%, transparent 50%),
                      radial-gradient(ellipse at 80% 80%, rgba(91,158,245,0.06) 0%, transparent 50%);
  }
  header { text-align: center; margin-bottom: 32px; width: 100%; max-width: 800px; }
  .tag {
    display: inline-block; font-family: "Syne", sans-serif; font-size: 11px; font-weight: 700;
    letter-spacing: 0.15em; text-transform: uppercase; color: var(--accent);
    background: rgba(91,245,160,0.1); border: 1px solid rgba(91,245,160,0.3);
    padding: 4px 12px; border-radius: 999px; margin-bottom: 14px;
  }
  h1 { font-family: "Syne", sans-serif; font-size: clamp(22px,4vw,38px); font-weight: 800; line-height: 1.1; color: #fff; margin-bottom: 6px; }
  h1 span { color: var(--accent); }
  .subtitle { font-size: 13px; color: var(--text-muted); letter-spacing: 0.03em; }
  .progress-wrap { width: 100%; max-width: 700px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; }
  .progress-bar-bg { flex: 1; height: 4px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent3)); border-radius: 99px; transition: width 0.4s ease; }
  .progress-label { font-size: 12px; color: var(--text-muted); white-space: nowrap; }
  .mode-tabs { display: flex; gap: 8px; margin-bottom: 24px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 4px; }
  .tab-btn { font-family: "Syne", sans-serif; font-size: 12px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; padding: 8px 18px; border-radius: 9px; border: none; cursor: pointer; background: transparent; color: var(--text-muted); transition: all 0.2s; }
  .tab-btn.active { background: var(--accent); color: #0e0f13; }
  .tab-btn:hover:not(.active) { color: var(--text); background: var(--border); }
  .card-scene { perspective: 1200px; width: 100%; max-width: 700px; height: 380px; margin-bottom: 28px; cursor: pointer; animation: slideIn 0.4s ease both; }
  .card-scene.image-card { height: 460px; }
  .card-inner { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.55s cubic-bezier(0.23,1,0.32,1); }
  .card-inner.flipped { transform: rotateY(180deg); }
  .card-face { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: 20px; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 40px; text-align: center; border: 1px solid var(--border); overflow: auto; }
  .card-front-face { background: var(--card-front); box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.05); }
  .card-back-face { background: var(--card-back); transform: rotateY(180deg); box-shadow: var(--shadow), inset 0 1px 0 rgba(91,245,160,0.08); border-color: rgba(91,245,160,0.2); }
  .card-label { font-size: 10px; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 20px; opacity: 0.7; }
  .card-front-face .card-label { color: var(--accent3); }
  .card-back-face .card-label { color: var(--accent); }
  .card-text { font-family: "Syne", sans-serif; font-size: clamp(18px,3vw,26px); font-weight: 700; line-height: 1.3; color: #fff; }
  .card-back-face .card-text { font-family: "DM Mono", monospace; font-size: clamp(13px,1.8vw,15px); font-weight: 400; line-height: 1.75; text-align: left; color: var(--text); }
  .card-number { position: absolute; top: 18px; right: 22px; font-size: 11px; color: var(--text-muted); opacity: 0.5; }
  .flip-hint { position: absolute; bottom: 18px; right: 22px; font-size: 11px; color: var(--text-muted); opacity: 0.5; }
  .controls { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: center; margin-bottom: 20px; width: 100%; max-width: 700px; }
  .ctrl-btn { font-family: "Syne", sans-serif; font-size: 13px; font-weight: 700; padding: 10px 20px; border-radius: 10px; border: 1px solid var(--border); cursor: pointer; background: var(--surface); color: var(--text); transition: all 0.18s; letter-spacing: 0.03em; display: flex; align-items: center; gap: 6px; }
  .ctrl-btn:hover { background: var(--border); border-color: var(--accent); color: #fff; }
  .ctrl-btn:active { transform: scale(0.97); }
  .ctrl-btn.primary { background: var(--accent); color: #0e0f13; border-color: var(--accent); }
  .ctrl-btn.primary:hover { background: #4de08e; }
  .ctrl-btn.active-toggle { background: rgba(91,245,160,0.15); border-color: var(--accent); color: var(--accent); }
  .nav-group { display: flex; gap: 0; border-radius: 10px; overflow: hidden; border: 1px solid var(--border); }
  .nav-group .ctrl-btn { border-radius: 0; border: none; border-right: 1px solid var(--border); }
  .nav-group .ctrl-btn:last-child { border-right: none; }
  #quiz-section { display: none; width: 100%; max-width: 700px; }
  .quiz-question { font-family: "Syne", sans-serif; font-size: 18px; font-weight: 700; color: #fff; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 28px 32px; margin-bottom: 16px; text-align: center; line-height: 1.4; }
  .quiz-options { display: flex; flex-direction: column; gap: 10px; margin-bottom: 20px; }
  .quiz-opt { font-family: "DM Mono", monospace; font-size: 13px; padding: 14px 20px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; text-align: left; transition: all 0.15s; line-height: 1.5; }
  .quiz-opt:hover:not(.answered) { border-color: var(--accent3); background: rgba(91,158,245,0.08); }
  .quiz-opt.correct { background: rgba(91,245,160,0.15); border-color: var(--accent); color: var(--accent); }
  .quiz-opt.incorrect { background: rgba(245,91,91,0.12); border-color: #f55b5b; color: #f55b5b; }
  .quiz-feedback { text-align: center; font-family: "Syne", sans-serif; font-size: 15px; font-weight: 700; min-height: 28px; margin-bottom: 16px; }
  .quiz-score { font-family: "Syne", sans-serif; font-size: 13px; color: var(--text-muted); text-align: center; margin-bottom: 16px; }
  #study-section { display: none; width: 100%; max-width: 700px; }
  .study-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .study-table th { font-family: "Syne", sans-serif; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); padding: 12px 16px; border-bottom: 1px solid var(--border); text-align: left; }
  .study-table td { padding: 14px 16px; border-bottom: 1px solid rgba(42,45,58,0.5); vertical-align: top; line-height: 1.6; color: var(--text); }
  .study-table tr:hover td { background: rgba(255,255,255,0.02); }
  .study-table td:first-child { font-family: "Syne", sans-serif; font-weight: 700; font-size: 13px; color: #fff; width: 38%; }
  .timer-ring-wrap { display: none; align-items: center; justify-content: center; margin-bottom: 12px; }
  .timer-ring-wrap.visible { display: flex; }
  .timer-ring { position: relative; width: 44px; height: 44px; }
  .timer-ring svg { transform: rotate(-90deg); }
  .timer-ring .track { fill: none; stroke: var(--border); stroke-width: 3; }
  .timer-ring .fill { fill: none; stroke: var(--accent); stroke-width: 3; stroke-linecap: round; stroke-dasharray: 113; stroke-dashoffset: 113; transition: stroke-dashoffset 0.1s linear; }
  .timer-ring .count { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: "Syne", sans-serif; font-size: 13px; font-weight: 700; color: var(--accent); }
  @keyframes slideIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>
<header>
  <div class="tag">Database Concepts</div>
  <h1>Primary Keys <span>vs.</span> Foreign Keys</h1>
  <p class="subtitle">9 cards &nbsp;·&nbsp; Flip, quiz, study, shuffle &amp; auto-flip</p>
</header>
<div class="mode-tabs">
  <button class="tab-btn active" onclick="setMode('flash')">⚡ Flashcards</button>
  <button class="tab-btn" onclick="setMode('study')">📖 Study</button>
  <button class="tab-btn" onclick="setMode('quiz')">🎯 Quiz</button>
</div>
<div class="progress-wrap" id="progress-wrap">
  <div class="progress-bar-bg"><div class="progress-bar-fill" id="progress-fill" style="width:11.1%"></div></div>
  <div class="progress-label" id="progress-label">1 / 9</div>
</div>
<div class="timer-ring-wrap" id="timer-ring-wrap">
  <div class="timer-ring">
    <svg width="44" height="44" viewBox="0 0 44 44">
      <circle class="track" cx="22" cy="22" r="18"/>
      <circle class="fill" id="timer-fill" cx="22" cy="22" r="18"/>
    </svg>
    <div class="count" id="timer-count">4</div>
  </div>
</div>
<div class="card-scene" id="card-scene" onclick="flipCard()">
  <div class="card-inner" id="card-inner">
    <div class="card-face card-front-face">
      <div class="card-number" id="card-number-front">1 / 9</div>
      <div class="card-label">Term / Question</div>
      <div class="card-text" id="card-front-text"></div>
      <div class="flip-hint">click to flip ↻</div>
    </div>
    <div class="card-face card-back-face">
      <div class="card-number" id="card-number-back">1 / 9</div>
      <div class="card-label">Answer / Definition</div>
      <div class="card-text" id="card-back-text"></div>
      <div class="flip-hint">click to flip ↻</div>
    </div>
  </div>
</div>
<div class="controls" id="flash-controls">
  <div class="nav-group">
    <button class="ctrl-btn" onclick="prevCard()">← Prev</button>
    <button class="ctrl-btn" onclick="nextCard()">Next →</button>
  </div>
  <button class="ctrl-btn primary" onclick="flipCard()">⟳ Flip</button>
  <button class="ctrl-btn" onclick="shuffle()">🔀 Shuffle</button>
  <button class="ctrl-btn" id="auto-btn" onclick="toggleAuto()">⏱ Auto Flip</button>
</div>
<div id="study-section">
  <table class="study-table">
    <thead><tr><th>Term / Question</th><th>Answer / Definition</th></tr></thead>
    <tbody id="study-tbody"></tbody>
  </table>
</div>
<div id="quiz-section">
  <div class="quiz-question" id="quiz-q"></div>
  <div class="quiz-options" id="quiz-opts"></div>
  <div class="quiz-feedback" id="quiz-fb"></div>
  <div class="quiz-score" id="quiz-score"></div>
  <div style="display:flex;gap:10px;justify-content:center;">
    <button class="ctrl-btn primary" id="quiz-next-btn" onclick="nextQuiz()" style="display:none;">Next Question →</button>
    <button class="ctrl-btn" onclick="restartQuiz()">↺ Restart Quiz</button>
  </div>
</div>
<script>
const RAW_CARDS = [{"id": 1, "front": "Primary Key (PK)", "back": "A <strong>unique identifier</strong> for each record in a single table.<br><br>Rules:<br>\u2022 Must be UNIQUE<br>\u2022 Cannot be NULL<br>\u2022 One per table<br><br><em>Example: StudentID in a STUDENTS table</em>"}, {"id": 2, "front": "Foreign Key (FK)", "back": "A field that <strong>refers to the Primary Key</strong> of ANOTHER table to link them.<br><br>Purpose:<br>\u2022 Creates relationships between tables<br>\u2022 Maintains referential integrity<br><br><em>Example: CustomerID in an ORDERS table</em>"}, {"id": 3, "front": "How does a Foreign Key create a relationship?", "back": "The FK in one table <strong>matches</strong> the PK in another table.<br><br>Example:<br>LOANS table contains:<br>\u2022 LoanID (PK)<br>\u2022 ReaderNumber (FK \u2192 READERS)<br>\u2022 BookID (FK \u2192 BOOKS)<br><br>This tells you <em>who borrowed what!</em>"}, {"id": 4, "front": "MYTH: Primary Keys can contain duplicates or nulls.", "back": "\u274c <strong>MYTH \u2014 This is FALSE!</strong><br><br>\u2705 REALITY: PKs are a <em>definitive fingerprint</em>.<br><br>They MUST be:<br>\u2022 Unique (no duplicates ever)<br>\u2022 Non-null (always have a value)<br><br>Violating these rules breaks the entire table structure."}, {"id": 5, "front": "Real Example: E-Commerce Database", "back": "<strong>CUSTOMERS</strong> (CustomerID PK, Name)<br>\u2193<br><strong>ORDERS</strong> (OrderID PK, CustomerID FK, OrderDate)<br>\u2193<br><strong>ORDER_ITEMS</strong> (OrderItemID PK, OrderID FK, ProductID)<br><br>CustomerID links Orders \u2192 Customers<br>OrderID links Order_Items \u2192 Orders"}, {"id": 6, "front": "Common Mistake: Disconnected Tables", "back": "\u274c <strong>Problem:</strong> EMPLOYEES and PROJECTS tables with no linking fields.<br><br>Result: You can not tell who is on what project!<br><br>\u2705 <strong>Fix:</strong> Add a junction table:<br>ASSIGNMENTS (EmployeeID FK, ProjectID FK)<br><br><em>Always look for relationships \u2014 avoid disconnected data!</em>"}, {"id": 7, "front": "3 Key Takeaways: PKs and FKs", "back": "1\ufe0f\u20e3 <strong>Primary Key</strong> = Unique identifier in a table. One per table. Never null. Always use one!<br><br>2\ufe0f\u20e3 <strong>Foreign Key</strong> = Links tables. Matches the PK of another table. Maintains relationships.<br><br>3\ufe0f\u20e3 <strong>Look for relationships!</strong> They build better database structure. Avoid disconnected data."}, {"id": 8, "front": "Fun Fact: Who Invented Relational Database Keys?", "back": "The concept of keys in relational database design was pioneered by<br><br><strong>Edgar F. Codd</strong><br>at IBM in the 1970s!<br><br>He laid the foundation for modern relational databases \u2014 the same principles we use today in MySQL, PostgreSQL, and SQL Server."}, {"id": 9, "front": "Primary Keys vs. Foreign Keys \u2014 Visual Summary", "back": "<img src=\"data:image/png;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/4gHYSUNDX1BST0ZJTEUAAQEAAAHIAAAAAAQwAABtbnRyUkdCIFhZWiAH4AABAAEAAAAAAABhY3NwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAQAA9tYAAQAAAADTLQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAlkZXNjAAAA8AAAACRyWFlaAAABFAAAABRnWFlaAAABKAAAABRiWFlaAAABPAAAABR3dHB0AAABUAAAABRyVFJDAAABZAAAAChnVFJDAAABZAAAAChiVFJDAAABZAAAAChjcHJ0AAABjAAAADxtbHVjAAAAAAAAAAEAAAAMZW5VUwAAAAgAAAAcAHMAUgBHAEJYWVogAAAAAAAAb6IAADj1AAADkFhZWiAAAAAAAABimQAAt4UAABjaWFlaIAAAAAAAACSgAAAPhAAAts9YWVogAAAAAAAA9tYAAQAAAADTLXBhcmEAAAAAAAQAAAACZmYAAPKnAAANWQAAE9AAAApbAAAAAAAAAABtbHVjAAAAAAAAAAEAAAAMZW5VUwAAACAAAAAcAEcAbwBvAGcAbABlACAASQBuAGMALgAgADIAMAAxADb/2wBDAAUDBAQEAwUEBAQFBQUGBwwIBwcHBw8LCwkMEQ8SEhEPERETFhwXExQaFRERGCEYGh0dHx8fExciJCIeJBweHx7/2wBDAQUFBQcGBw4ICA4eFBEUHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh4eHh7/wAARCAMABWADASIAAhEBAxEB/8QAHQAAAQQDAQEAAAAAAAAAAAAABwABBggCBAUDCf/EAHQQAAEDAwIDBAQEDQoNEQYBDQECAwQFBhEABxIhMQgTQVEUImFxFTKBkRYjQlJygpKhscHR0tMXM2KDk6KjsrPCCRgkNENTVFVllaTD1CUnNTdERUZHV2NzdHWFlLThKDY4VmSEJpb let cards = [...RAW_CARDS];
let idx = 0, isFlipped = false, autoTimer = null, autoPhase = "front";
const AUTO_DURATION = 4;
let quizIdx = 0, quizCards = [], quizScore = 0, quizAnswered = false;

function stripHtml(h) { const d = document.createElement("div"); d.innerHTML = h; return d.textContent || ""; }

function renderCard() {
  const c = cards[idx];
  document.getElementById("card-front-text").innerHTML = c.front;
  document.getElementById("card-back-text").innerHTML = c.back;
  const lbl = (idx+1) + " / " + cards.length;
  document.getElementById("card-number-front").textContent = lbl;
  document.getElementById("card-number-back").textContent = lbl;
  document.getElementById("progress-label").textContent = lbl;
  document.getElementById("progress-fill").style.width = (((idx+1)/cards.length)*100) + "%";
  document.getElementById("card-scene").classList.toggle("image-card", !!c.is_image);
}

function flipCard() {
  const inner = document.getElementById("card-inner");
  inner.classList.toggle("flipped");
  isFlipped = !isFlipped;
}

function setFlipped(state) {
  const inner = document.getElementById("card-inner");
  if (state && !isFlipped) { inner.classList.add("flipped"); isFlipped = true; }
  else if (!state && isFlipped) { inner.classList.remove("flipped"); isFlipped = false; }
}

function goTo(n) {
  idx = ((n % cards.length) + cards.length) % cards.length;
  setFlipped(false);
  renderCard();
}

function prevCard() { goTo(idx - 1); }
function nextCard() { goTo(idx + 1); }

function shuffle() {
  for (let i = cards.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [cards[i],cards[j]] = [cards[j],cards[i]];
  }
  goTo(0);
}

function toggleAuto() {
  if (autoTimer) {
    clearInterval(autoTimer); autoTimer = null;
    document.getElementById("auto-btn").classList.remove("active-toggle");
    document.getElementById("auto-btn").textContent = "⏱ Auto Flip";
    document.getElementById("timer-ring-wrap").classList.remove("visible");
    return;
  }
  document.getElementById("auto-btn").classList.add("active-toggle");
  document.getElementById("auto-btn").textContent = "⏹ Stop Auto";
  document.getElementById("timer-ring-wrap").classList.add("visible");
  autoPhase = "front"; setFlipped(false); runAutoStep();
}

function runAutoStep() {
  const totalSteps = AUTO_DURATION * 10;
  let step = 0;
  const fill = document.getElementById("timer-fill");
  const count = document.getElementById("timer-count");
  const circum = 113;
  if (autoTimer) clearInterval(autoTimer);
  autoTimer = setInterval(() => {
    step++;
    fill.style.strokeDashoffset = circum * (1 - step/totalSteps);
    count.textContent = Math.max(1, Math.ceil(AUTO_DURATION - step/10));
    if (step >= totalSteps) {
      clearInterval(autoTimer); autoTimer = null;
      if (autoPhase === "front") { autoPhase = "flipped"; setFlipped(true); runAutoStep(); }
      else { autoPhase = "front"; nextCard(); runAutoStep(); }
    }
  }, 100);
}

function setMode(mode) {
  document.querySelectorAll(".tab-btn").forEach((b,i) => b.classList.toggle("active", ["flash","study","quiz"][i] === mode));
  document.getElementById("card-scene").style.display = mode==="flash" ? "block" : "none";
  document.getElementById("flash-controls").style.display = mode==="flash" ? "flex" : "none";
  document.getElementById("study-section").style.display = mode==="study" ? "block" : "none";
  document.getElementById("quiz-section").style.display = mode==="quiz" ? "block" : "none";
  document.getElementById("progress-wrap").style.display = mode==="flash" ? "flex" : "none";
  if (mode !== "flash" && autoTimer) toggleAuto();
  if (mode !== "flash") document.getElementById("timer-ring-wrap").classList.remove("visible");
  if (mode === "study") buildStudy();
  if (mode === "quiz") startQuiz();
}

function buildStudy() {
  document.getElementById("study-tbody").innerHTML = RAW_CARDS.map(c =>
    "<tr><td>" + (c.is_image ? "📊 Visual Summary" : c.front) + "</td><td>" + (c.is_image ? "See the infographic flashcard for a full visual comparison." : stripHtml(c.back)) + "</td></tr>"
  ).join("");
}

function startQuiz() {
  quizCards = [...RAW_CARDS].filter(c => !c.is_image);
  for (let i=quizCards.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [quizCards[i],quizCards[j]]=[quizCards[j],quizCards[i]]; }
  quizIdx = 0; quizScore = 0; quizAnswered = false;
  renderQuiz();
}

function restartQuiz() { startQuiz(); }

function renderQuiz() {
  if (quizIdx >= quizCards.length) {
    document.getElementById("quiz-q").textContent = "🎉 Quiz Complete!";
    document.getElementById("quiz-opts").innerHTML = "";
    document.getElementById("quiz-fb").innerHTML = "<span style='color:var(--accent)'>Final Score: " + quizScore + " / " + quizCards.length + "</span>";
    document.getElementById("quiz-score").textContent = "";
    document.getElementById("quiz-next-btn").style.display = "none";
    return;
  }
  const card = quizCards[quizIdx];
  document.getElementById("quiz-q").textContent = card.front;
  document.getElementById("quiz-fb").textContent = "";
  document.getElementById("quiz-next-btn").style.display = "none";
  document.getElementById("quiz-score").textContent = "Question " + (quizIdx+1) + " of " + quizCards.length + " · Score: " + quizScore;
  const wrongPool = quizCards.filter((_,i) => i !== quizIdx).map(c => stripHtml(c.back));
  const wrongs = []; const used = new Set();
  while (wrongs.length < 3 && wrongPool.length > wrongs.length) {
    const pick = wrongPool[Math.floor(Math.random()*wrongPool.length)];
    const short = pick.substring(0,120);
    if (!used.has(short)) { used.add(short); wrongs.push(short); }
  }
  const correctShort = stripHtml(card.back).substring(0,120);
  let opts = [...wrongs.map(w => ({text:w,correct:false})), {text:correctShort,correct:true}];
  for (let i=opts.length-1;i>0;i--) { const j=Math.floor(Math.random()*(i+1)); [opts[i],opts[j]]=[opts[j],opts[i]]; }
  document.getElementById("quiz-opts").innerHTML = opts.map((o,i) =>
    "<button class='quiz-opt' onclick='answerQuiz(this," + o.correct + ")'>" + o.text + (o.text.length>=120?"…":"") + "</button>"
  ).join("");
  quizAnswered = false;
}

function answerQuiz(btn, correct) {
  if (quizAnswered) return;
  quizAnswered = true;
  document.querySelectorAll(".quiz-opt").forEach(b => b.classList.add("answered"));
  if (correct) {
    btn.classList.add("correct");
    document.getElementById("quiz-fb").innerHTML = "<span style='color:var(--accent)'>✓ Correct!</span>";
    quizScore++;
  } else {
    btn.classList.add("incorrect");
    const correctText = stripHtml(quizCards[quizIdx].back).substring(0,120);
    document.querySelectorAll(".quiz-opt").forEach(b => { if (b.textContent.replace("…","").trim() === correctText.trim() || b.textContent.startsWith(correctText.substring(0,50))) b.classList.add("correct"); });
    document.getElementById("quiz-fb").innerHTML = "<span style='color:#f55b5b'>✗ Not quite — correct answer highlighted</span>";
  }
  document.getElementById("quiz-score").textContent = "Question " + (quizIdx+1) + " of " + quizCards.length + " · Score: " + quizScore;
  document.getElementById("quiz-next-btn").style.display = "inline-flex";
}

function nextQuiz() { quizIdx++; renderQuiz(); }

renderCard();
</script>
